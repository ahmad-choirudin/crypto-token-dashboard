<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Token Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Crypto Dashboard</h1>
        <p>Track your favorite tokens</p>
    </header>

    <main>
        <section class="token-grid">

            <div class="token-card">
                <h2>Bitcoin</h2>
                <p class="symbol">BTC</p>
                <p class="price">$67,250</p>
                <p class="change positive">+2.45%</p>
            </div>

            <div class="token-card">
                <h2>Ethereum</h2>
                <p class="symbol">ETH</p>
                <p class="price">$3,450</p>
                <p class="change positive">+1.82%</p>
            </div>

            <div class="token-card">
                <h2>Solana</h2>
                <p class="symbol">SOL</p>
                <p class="price">$145</p>
                <p class="change negative">-0.65%</p>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
